[package]
name = "boulot"
version = "0.1.0"
description = "Your career, run like a product"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
